<!DOCTYPE html><html class="h-full bg-black" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<title>Captura de Acta Electoral E-14</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#00E676',
              greenDark: '#00B359',
              greenMuted: '#003B20',
              panel: '#0C110F',
              chip: '#121915',
              border: '#1B2620'
            }
          },
          fontFamily: {
            mono: ['SF Mono', 'ui-monospace', 'Menlo', 'Monaco', 'Cascadia Mono', 'Courier New', 'monospace'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif']
          }

<!-- Custom Styles for Scanner and Viewport -->
<style data-purpose="custom-animations">
    @keyframes scan-laser {
      0% {
        top: 2%;
        opacity: 0.15;
      }
      50% {
        opacity: 0.95;
      }
      100% {
        top: 98%;
        opacity: 0.15;
      }
    }

    .animate-scan {
      animation: scan-laser 2.8s ease-in-out infinite alternate;
    }

    @keyframes pulse-ring {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.4);
      }
      50% {
        transform: scale(1.02);
        box-shadow: 0 0 0 8px rgba(0, 230, 118, 0);
      }
    }

    .shutter-glow {
      animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="h-full w-full bg-black text-white font-sans antialiased overflow-hidden select-none touch-none">

<main class="relative h-full w-full max-w-md mx-auto flex flex-col justify-between overflow-hidden bg-[#050706] shadow-2xl">

<!-- Fine scanline texture overlay -->
<div class="absolute inset-0 bg-[linear-gradient(rgba(18,25,21,0)_50%,rgba(0,0,0,0.45)_50%)] bg-[length:100%_4px] opacity-40"></div>
</div>
<!-- END: LiveCameraFeedSimulation -->
<!-- BEGIN: TopBarAndStatusControls -->

<!-- Mesa Identifier -->

<!-- Page Indicator -->

<!-- Primary Controls Row -->
<div class="w-full max-w-sm mx-auto mb-1 px-1 flex items-center justify-between text-[10px] font-mono font-medium tracking-widest uppercase text-gray-400 select-none"><span class="flex items-center gap-1"><span class="w-1 h-1 rounded-full bg-brand-green/60"></span>SIMULACIÓN</span><span class="text-[9px] text-gray-400 opacity-75">TEST SCORES</span></div><div class="w-full max-w-sm mx-auto mb-3 px-1 flex items-center justify-between gap-1.5 bg-black/60 border border-white/10 rounded-xl p-1.5 backdrop-blur-md shadow-sm z-30" data-purpose="score-simulation-bar"><button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2 rounded-lg bg-[#00E676]/10 border border-[#00E676]/40 hover:bg-[#00E676]/20 active:scale-95 transition-all text-[#00E676] focus:outline-none" title="Simular Score Óptimo"><span class="w-1.5 h-1.5 rounded-full bg-[#00E676] animate-pulse"></span><span class="text-[10px] font-bold tracking-wider uppercase font-mono">Óptimo</span><span class="text-[9px] opacity-75 font-mono">(9.8)</span></button><button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2 rounded-lg bg-yellow-500/10 border border-yellow-500/40 hover:bg-yellow-500/20 active:scale-95 transition-all text-yellow-400 focus:outline-none" title="Simular Score Intermedio"><span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span><span class="text-[10px] font-bold tracking-wider uppercase font-mono">Medio</span><span class="text-[9px] opacity-75 font-mono">(7.8)</span></button><button type="button" class="flex-1 flex items-center justify-center gap-1.5 py-1 px-2 rounded-lg bg-red-500/10 border border-red-500/40 hover:bg-red-500/20 active:scale-95 transition-all text-red-400 focus:outline-none" title="Simular Score Bajo"><span class="w-1.5 h-1.5 rounded-full bg-red-400"></span><span class="text-[10px] font-bold tracking-wider uppercase font-mono">Bajo</span><span class="text-[9px] opacity-75 font-mono">(4.2)</span></button></div><div class="w-full flex items-center justify-between max-w-sm px-2 mb-2" data-purpose="shutter-action-dock">
<!-- Action 1: Importar (Gallery / File picker) -->

<div class="w-10 h-10 rounded-full flex items-center justify-center text-white/90 group-hover:text-brand-green transition-colors">
<!-- Icon: Document with downward download arrow -->
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">

<path d="M12 11v5m0 0l-2-2m2 2l2-2" stroke-linecap="round" stroke-linejoin="round"></path>

<div class="flex flex-col items-center -mt-2">

<!-- Inner circular button housing document icon -->
<div class="w-full h-full rounded-full bg-brand-panel border border-brand-green/40 flex items-center justify-center text-white active:bg-brand-green/20">
<!-- Document icon with technical text lines -->
<svg class="w-8 h-8 text-white drop-shadow" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
</div>

</button>

      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>

  </button>
  <!-- Nav Item: RESUMEN -->

    <div class="w-8 h-8 flex items-center justify-center">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">

<!-- BEGIN: InteractiveCameraFeedbackScript -->
<script data-purpose="camera-haptic-simulation">
    // Subtle visual feedback when pressing shutter button
    const shutterBtn = document.getElementById('shutter-capture-btn');
    if (shutterBtn) {
      shutterBtn.addEventListener('click', () => {
        // Flash screen animation simulation
        const flashOverlay = document.createElement('div');
        flashOverlay.className = 'fixed inset-0 bg-white z-50 pointer-events-none transition-opacity duration-300 opacity-90';
        document.body.appendChild(flashOverlay);
        
        requestAnimationFrame(() => {
          flashOverlay.style.opacity = '0';
          setTimeout(() => {
            flashOverlay.remove();
          }, 320);
        });
      });
    }
  </script>
<!-- END: InteractiveCameraFeedbackScript -->
